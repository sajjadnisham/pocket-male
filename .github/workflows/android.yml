name: Android app

# Builds the Android app from the site on every push to main and publishes the
# APK at a fixed link:
#   https://github.com/sajjadnisham/pocket-male/releases/download/android-latest/pocket-male.apk
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'server/**', 'tools/generate-audio.py', 'tools/build-city-data.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the site into www/
        run: node tools/build-www.js

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: |
          mkdir -p assets
          cp icons/icon-1024.png assets/icon-only.png
          cp icons/splash.png assets/splash.png
          cp icons/splash.png assets/splash-dark.png
          npx capacitor-assets generate --android --iconBackgroundColor '#faf7f1' --iconBackgroundColorDark '#faf7f1' --splashBackgroundColor '#faf7f1' --splashBackgroundColorDark '#faf7f1'

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pocket-male.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-male-apk
          path: pocket-male.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest pocket-male.apk \
            --target "$GITHUB_SHA" \
            --title "Pocket Malé for Android (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download pocket-male.apk on an Android phone and open it; allow installing from your browser when Android asks. This is a test build (debug-signed), not the Play Store version."
