<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pocket Malé</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Pocket Malé">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Thaana:wght@400;600&display=swap">

<style>
:root{
  --paper:#faf7f1;
  --paper-2:#f2ebdf;
  --card:#fffdf8;
  --ink:#1a1814;
  --ink-2:#4a463f;
  --muted:#8a8478;
  --rule:#ece4d6;
  --red:#9c3a2d;
  --red-deep:#7e2f23;
  --navy:#1f2535;
  --navy-2:#2a3347;
  --blush:#f9e9e6;
  --ochre:#c08417;
  --lagoon:#0d6663;
  --sea:#e3ebe8;
  --scene-bg:#efe6d4;
  --scene-2:#d9cdb4;
  --lift:0 1px 2px rgba(26,24,20,.04), 0 6px 18px -12px rgba(26,24,20,.22);
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --dv:'Noto Sans Thaana','MV Faseyha','A_Faruma','Faruma',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141210; --paper-2:#1e1a15; --card:#1c1813;
    --ink:#f2ebdf; --ink-2:#c4bcab; --muted:#8d8578; --rule:#302a22;
    --red:#c25139; --red-deep:#a33f2b;
    --navy:#161d2b; --navy-2:#1f2839;
    --blush:#2b1f1c;
    --ochre:#e0a83c; --lagoon:#63bdb1; --sea:#111b1a;
    --scene-bg:#241f19; --scene-2:#342d23;
    --lift:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#141210; --paper-2:#1e1a15; --card:#1c1813;
  --ink:#f2ebdf; --ink-2:#c4bcab; --muted:#8d8578; --rule:#302a22;
  --red:#c25139; --red-deep:#a33f2b;
  --navy:#161d2b; --navy-2:#1f2839;
  --blush:#2b1f1c;
  --ochre:#e0a83c; --lagoon:#63bdb1; --sea:#111b1a;
  --scene-bg:#241f19; --scene-2:#342d23;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.015em;margin:0}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}

.dv{font-family:var(--dv);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.rom{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* ---------------- shell ---------------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 0 40px}
@media (min-width:900px){.app{max-width:860px}}

.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:14px 18px 10px;
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;
  background:linear-gradient(var(--paper),transparent);pointer-events:none;
}
.brandrow{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-style:italic;font-weight:500;font-size:1.62rem;letter-spacing:-.02em;white-space:nowrap}
.brand .dv{font-style:normal;font-weight:400;color:var(--red);font-size:1.3rem;margin-left:8px}
.tagline{font-family:var(--display);font-style:italic;font-size:.86rem;color:var(--muted);margin-top:2px}
.gear{
  margin-left:auto;width:34px;height:34px;border-radius:999px;
  display:grid;place-items:center;color:var(--muted);flex:0 0 34px;
}
.gear:hover{color:var(--ink);background:var(--paper-2)}
.gear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6}
.back{
  display:inline-flex;align-items:center;gap:6px;color:var(--red);
  font-size:.9rem;padding:6px 0;
}
.crumb{font-family:var(--display);font-size:1.1rem;font-style:italic;color:var(--ink);margin-left:2px}

.view{display:none;padding:8px 18px 0}
.view.on{display:block}

/* ---------------- scene of the day ---------------- */
.sceneday{
  display:block;width:100%;position:relative;overflow:hidden;
  background:linear-gradient(103deg,var(--red) 0%,var(--red-deep) 100%);
  color:#fdf4ea;border-radius:14px;padding:15px 17px 16px;margin:6px 0 14px;
  box-shadow:var(--lift);
}
.sceneday::after{
  content:"";position:absolute;right:-46px;top:-38px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.07);
}
.sceneday .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,244,234,.72)}
.sceneday .name{display:flex;align-items:center;gap:9px;margin-top:7px}
.sceneday .name .em{font-size:1.24rem;line-height:1}
.sceneday .name .dv{font-size:1.44rem;color:#fff}
.sceneday .sub{font-size:.86rem;color:rgba(253,244,234,.86);margin-top:5px;max-width:30ch}
.sceneday .arrow{position:absolute;right:18px;bottom:16px;font-size:1.1rem;color:rgba(253,244,234,.8)}

/* ---------------- search + chips ---------------- */
.searchrow{display:flex;gap:7px;align-items:center;margin-bottom:14px}
.search{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;
  background:var(--paper-2);border:1px solid transparent;border-radius:999px;padding:8px 14px;
}
.search:focus-within{border-color:var(--rule);background:var(--card)}
.search svg{width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:1.8;flex:0 0 14px}
.search input{
  border:0;background:none;outline:none;flex:1;min-width:0;
  font-family:var(--display);font-style:italic;font-size:.94rem;color:var(--ink);
}
.search input::placeholder{color:var(--muted)}
.cchip{
  flex:0 0 auto;width:34px;height:34px;border-radius:999px;
  border:1px solid var(--rule);background:var(--card);
  display:grid;place-items:center;font-size:.82rem;color:var(--ink-2);
}
.cchip.wide{width:auto;padding:0 11px;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em}
.cchip.sos{background:var(--blush);border-color:transparent;color:var(--red);font-weight:500}
.cchip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fdf4ea}
.cchip:hover{border-color:var(--muted)}

/* ---------------- explore + review cards ---------------- */
.explore{
  display:block;width:100%;background:var(--navy);color:#e8ecf4;
  border-radius:14px;padding:14px 17px 15px;margin-bottom:10px;box-shadow:var(--lift);
}
.explore .top{display:flex;align-items:center;gap:9px}
.explore .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#c9a86a}
.explore .badge{
  font-family:var(--mono);font-size:.53rem;letter-spacing:.12em;text-transform:uppercase;
  background:var(--red);color:#fdf4ea;padding:3px 7px;border-radius:4px;
}
.explore .title{display:flex;align-items:center;gap:9px;margin-top:6px;flex-wrap:wrap}
.explore .title .dv{font-size:1.3rem;color:#fff}
.explore .title .en{font-size:1.02rem;font-weight:500}
.explore .sub{font-size:.82rem;color:#9aa4b8;margin-top:4px}

.review{
  display:flex;align-items:center;gap:12px;width:100%;
  background:var(--blush);border-radius:12px;padding:12px 15px;margin-bottom:20px;
}
.review .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.review .badge{
  font-family:var(--mono);font-size:.53rem;letter-spacing:.12em;text-transform:uppercase;
  background:var(--red);color:#fdf4ea;padding:3px 7px;border-radius:4px;margin-left:8px;
}
.review .txt{font-size:.86rem;color:var(--ink-2);margin-top:5px}
.review .heart{margin-left:auto;color:var(--red);font-size:1.02rem;flex:0 0 auto}
.review .x{color:var(--muted);font-size:1.02rem;flex:0 0 auto;padding:2px 4px}
.review .x:hover{color:var(--ink)}

/* ---------------- section heads + grid ---------------- */
.sec-head{display:flex;align-items:baseline;gap:8px;margin:22px 0 11px}
.sec-head h2{font-family:var(--display);font-size:1.16rem;font-weight:600;letter-spacing:-.01em}
.sec-head .mk{font-size:.92rem;color:var(--ink-2)}
.sec-head .act{margin-left:auto;font-size:.8rem;color:var(--red)}
.sec-head .act:hover{text-decoration:underline}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
.tile{
  background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:13px 14px 14px;box-shadow:var(--lift);position:relative;
  display:flex;flex-direction:column;gap:2px;min-height:104px;
  transition:transform .12s,border-color .15s;
}
.tile:hover{border-color:var(--muted)}
.tile:active{transform:scale(.985)}
.tile .em{font-size:1.34rem;line-height:1;margin-bottom:9px}
.tile .en{font-size:.96rem;font-weight:500;color:var(--ink)}
.tile .dv{font-size:1.12rem;color:var(--muted);margin-top:1px}
.tile .lock{position:absolute;top:11px;right:12px;font-size:.78rem;opacity:.75}
.tile.locked{opacity:.52}
.tile.locked .en,.tile.locked .dv{color:var(--muted)}
.empty-note{
  grid-column:1/-1;border:1px dashed var(--rule);border-radius:12px;
  padding:26px 20px;text-align:center;color:var(--muted);font-size:.88rem;
}

/* ---------------- situation detail ---------------- */
.detail-hero{border-radius:13px;overflow:hidden;border:1px solid var(--rule);margin:4px 0 14px}
.detail-hero .scene{display:block;width:100%;height:auto;background:var(--scene-bg)}
.d-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-head .em{font-size:1.3rem}
.d-head h2{font-size:1.5rem}
.d-head .dv{font-size:1.6rem;color:var(--red)}
.note{
  background:var(--paper-2);border-left:3px solid var(--ochre);
  padding:12px 15px;border-radius:0 10px 10px 0;margin:16px 0 20px;
}
.note .eyebrow{color:var(--ochre)}
.note p{font-size:.87rem;color:var(--ink-2);margin-top:6px}
.turns{display:flex;flex-direction:column;gap:10px}
.turn{
  background:var(--card);border:1px solid var(--rule);box-shadow:var(--lift);
  border-radius:13px;padding:12px 15px;max-width:90%;
  display:flex;flex-direction:column;gap:2px;
}
.turn.you{align-self:flex-start;border-bottom-left-radius:3px}
.turn.them{align-self:flex-end;border-bottom-right-radius:3px;background:var(--paper-2);box-shadow:none}
.turn .who{font-family:var(--mono);font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.turn.them .who{color:var(--lagoon)}
.turn .dv{font-size:1.54rem;color:var(--ink)}
.turn.them .dv{color:var(--lagoon)}
.turn .en{font-family:var(--display);font-style:italic;font-size:.94rem;color:var(--ink-2);margin-top:2px}
.turn .acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.71rem;color:var(--ink-2);
  border:1px solid var(--rule);border-radius:999px;padding:4px 10px;background:var(--paper);
}
.chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{color:var(--red);border-color:var(--red)}
.chip[aria-pressed="true"] svg{fill:var(--red);stroke:var(--red)}
.chip:hover{border-color:var(--muted)}
.sv-link{
  display:flex;align-items:center;gap:10px;width:100%;
  border:1px solid var(--rule);border-radius:13px;background:var(--card);
  padding:12px 15px;margin-top:18px;box-shadow:var(--lift);
}
.sv-link:hover{border-color:var(--muted)}
.sv-link .t{font-size:.88rem}
.sv-link .s{font-size:.75rem;color:var(--muted)}
.sv-link .arrow{margin-left:auto;color:var(--red)}
.sos-note{
  background:var(--blush);border-radius:12px;padding:13px 15px;margin:4px 0 18px;
  font-size:.86rem;color:var(--ink-2);
}
.sos-note b{font-family:var(--mono);font-size:.8rem;color:var(--red)}

/* ---------------- saved ---------------- */
.saved-list{display:flex;flex-direction:column;gap:10px}
.saved-item{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:12px 15px;box-shadow:var(--lift)}
.saved-item .from{font-family:var(--mono);font-size:.57rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.saved-item .dv{font-size:1.48rem}
.saved-item .en{font-family:var(--display);font-style:italic;font-size:.92rem;color:var(--ink-2);margin-top:3px}
.empty{border:1px dashed var(--rule);border-radius:13px;padding:32px 22px;text-align:center}
.empty .dv{font-size:2rem;color:var(--muted);display:block;margin-bottom:10px}
.empty p{font-size:.88rem;color:var(--muted);max-width:34ch;margin:0 auto}

/* ---------------- about ---------------- */
.about section{padding:18px 0;border-top:1px solid var(--rule)}
.about section:first-of-type{border-top:0;padding-top:4px}
.about h3{font-size:1.1rem;margin-bottom:6px}
.about p{font-size:.88rem;color:var(--ink-2);margin-top:7px;max-width:60ch}
.fn-row{display:grid;grid-template-columns:auto auto auto 1fr;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.fn-row:first-of-type{border-top:1px solid var(--rule)}
.fn-row .base{font-family:var(--dv);font-size:1.55rem;color:var(--muted)}
.fn-row .op{font-family:var(--mono);font-size:.64rem;color:var(--ochre);white-space:nowrap}
.fn-row .made{font-family:var(--dv);font-size:1.55rem;color:var(--ink)}
.fn-row .say{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right}
.fn-row .say b{color:var(--ink-2);font-weight:500}
.warn{background:var(--blush);border-left:3px solid var(--red);padding:12px 15px;border-radius:0 10px 10px 0;margin-top:12px}
.warn p{font-size:.85rem;color:var(--ink-2);margin-top:6px}
.warn .eyebrow{color:var(--red)}
.rowlink{display:flex;align-items:center;width:100%;padding:13px 2px;border-bottom:1px solid var(--rule);font-size:.92rem}
.rowlink .arrow{margin-left:auto;color:var(--muted)}
.rowlink:hover{color:var(--red)}

/* ---------------- scene svg ---------------- */
.scene .bg{fill:var(--scene-bg)}
.scene .e{fill:var(--scene-2)}
.scene .a{fill:var(--red)}
.scene .b{fill:var(--lagoon)}
.scene .c{fill:var(--ochre)}
.scene .d{fill:var(--ink)}
.scene .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene .lnm{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round}

/* ---------------- 3D world cards ---------------- */
a.explore{text-decoration:none}
.svcard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 15px;margin-bottom:10px;box-shadow:var(--lift)}
.svcard:hover{border-color:var(--muted)}
.svcard .ico{font-size:1.35rem}
.svcard .lab{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lagoon)}
.svcard .t{display:block;font-size:.98rem;font-weight:500;margin-top:2px}
.svcard .s{display:block;font-size:.8rem;color:var(--muted)}
.svcard .arrow{margin-left:auto;color:var(--lagoon)}

/* ---------------- ask ChatGPT ---------------- */
.askrow{display:flex;gap:8px;align-items:center;margin:16px 0 8px}
.search.ask{background:var(--card);border-color:var(--rule)}
.askbtn{flex:0 0 auto;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 13px;font-size:.78rem;white-space:nowrap}
.askbtn:hover{opacity:.9}
.asknote{font-size:.8rem;color:var(--muted);margin:0 2px 10px}
.asknote button{color:var(--red);font-size:.8rem}
.ai-card{background:var(--card);border:1px dashed var(--lagoon);border-radius:13px;padding:12px 14px;margin:0 0 16px}
.ai-card.err{border-color:var(--red)}
.ai-card .eyebrow{color:var(--lagoon)}
.ai-card.err .eyebrow{color:var(--red)}
.ai-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai-badge{margin-left:auto;font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lagoon);border:1px solid color-mix(in srgb,var(--lagoon) 40%,transparent);border-radius:5px;padding:2px 6px;white-space:nowrap}
.ai-p{font-size:.88rem;color:var(--ink-2);margin:6px 0 10px}
.ai-card .turn.ai{max-width:100%;box-shadow:none}
.ai-tip{font-size:.85rem;color:var(--ink-2);margin-top:10px;padding-left:10px;border-left:2px solid var(--ochre)}
.ai-foot{font-size:.72rem;color:var(--muted);margin-top:10px}
.keybox{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.klab{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kin{font:inherit;font-size:.9rem;padding:9px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)}
.kin:focus{outline:2px solid var(--red);outline-offset:1px}
.krow{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.about .klink{font-size:.78rem;color:var(--muted)}
.klink a{color:var(--red)}
.plan{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper-2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.84rem}
.plan b{font-weight:600}
.plan .tag{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:var(--card);color:var(--lagoon);border:1px solid var(--rule)}
.plan .tag.plus{background:var(--red);color:#fdf4ea;border-color:var(--red)}
.upgrade{background:var(--navy);color:#eef1f6;border-radius:14px;padding:14px 16px;margin:0 0 16px}
.upgrade .eyebrow{color:#f3c77a}
.upgrade h3{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:4px 0 6px;color:#fff}
.upgrade p{font-size:.86rem;color:#cdd3de;margin:0 0 10px}
.upgrade ul{margin:0 0 12px;padding-left:18px;font-size:.84rem;color:#dfe4ec;line-height:1.55}
.upgrade .krow .chip{background:#fdf4ea;color:var(--navy);border-color:transparent}
.upgrade .krow .chip.ghost{background:transparent;color:#eef1f6;border:1px solid rgba(255,255,255,.35)}
.upgrade .kin{background:#fff;margin-top:6px;width:100%}
.install{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:10px 12px;margin:0 0 14px;font-size:.84rem}
.install .ic{width:34px;height:34px;border-radius:8px;flex:none}
.install .tx{flex:1;line-height:1.35}
.install .tx b{display:block;font-weight:600}
.install .tx span{color:var(--muted);font-size:.76rem}
.install .x{color:var(--muted);padding:4px 6px}
.freehint{font-size:.74rem;color:var(--muted);margin:-2px 0 10px}

.walk3d{display:flex;align-items:center;gap:12px;width:100%;background:var(--navy);color:#e8ecf4;border-radius:14px;padding:13px 16px;margin-top:18px;box-shadow:var(--lift);text-decoration:none}
.walk3d .ico{font-size:1.4rem}
.walk3d .lab{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:#c9a86a}
.walk3d .t{display:block;font-size:.96rem;font-weight:500;margin-top:2px}
.walk3d .s{display:block;font-size:.8rem;color:#9aa4b8}
.walk3d .arrow{margin-left:auto;color:#c9a86a}

/* ---------------- toast ---------------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;
  background:var(--navy);color:#e8ecf4;font-size:.82rem;
  padding:11px 16px;border-radius:11px;z-index:60;
  box-shadow:0 8px 28px -10px rgba(0,0,0,.5);
  max-width:min(440px,90vw);display:flex;align-items:center;gap:12px;
}
.toast .x{color:#9aa4b8;flex:0 0 auto}
.toast .x:hover{color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
html{scroll-behavior:smooth}

/* ---------- storage ---------- */
const KEY = 'pocketmale.v2';
function loadState(){
  try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }
  catch(e){ return {}; }
}
function saveState(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}
let state = loadState();
if (!Array.isArray(state.saved)) state.saved = [];
if (typeof state.reviewCard !== 'boolean') state.reviewCard = true;
if (typeof state.unlocked !== 'boolean') state.unlocked = false;
if (!Array.isArray(state.aiSaved)) state.aiSaved = [];

const keyOf = (sid, i) => sid + ':' + i;
const isSaved = k => state.saved.indexOf(k) !== -1;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg, ms){
  const t = $('#toast');
  t.innerHTML = '<span>' + msg + '</span><button class="x" data-toast-close aria-label="Dismiss">✕</button>';
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms || 3600);
}
function sitById(id){
  if (id === 'sos') return SOS;
  return SITUATIONS.find(x => x.id === id);
}
function isFree(id){ return id === 'sos' || state.unlocked || sceneOfDay().id === id || (TILE[id] && TILE[id].free); }
function emOf(id){ return id === 'sos' ? SOS.em : (TILE[id] ? TILE[id].em : '•'); }

/* ---------- scene of the day ---------- */
function sceneOfDay(){
  const d = new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return SITUATIONS[day % SITUATIONS.length];
}

/* ---------- home ---------- */
let query = '', filter = null, sortAZ = false;

function renderHome(){
  const s = sceneOfDay();
  const q = query.trim().toLowerCase();

  let ids = SITUATIONS.map(x => x.id);
  if (q){
    ids = ids.filter(id => {
      const x = sitById(id);
      const hay = [x.en, x.rom, x.dv, x.note, ...x.turns.map(t => t.en + ' ' + t.rom + ' ' + t.dv)]
        .join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  if (filter === 'free')    ids = ids.filter(id => TILE[id] && TILE[id].free);
  if (filter === 'premium') ids = ids.filter(id => TILE[id] && !TILE[id].free);
  if (sortAZ) ids = ids.slice().sort((a,b) => sitById(a).en.localeCompare(sitById(b).en));

  const freeIds = ids.filter(id => TILE[id] && TILE[id].free);

/* ---------- ChatGPT via the Pocket Malé AI worker (server/worker.js) ----------
   The OpenAI key lives in the worker, never in the app. The worker grants one
   free question per device and checks Plus licences; the app only mirrors the
   plan it reports so the UI can say what's left. */
const CFG = window.POCKET_CONFIG || {};
const AI_URL = String(CFG.aiEndpoint || '').replace(/\/+$/, '');
const AIPLAN = 'pocketmale.plan', LICKEY = 'pocketmale.license', DEVKEY = 'pocketmale.device';
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
function deviceId(){
  let d = store.get(DEVKEY);
  if (!d || !/^[a-zA-Z0-9-]{16,64}$/.test(d)){
    d = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
    store.set(DEVKEY, d);
  }
  return d;
}
function cachedPlan(){ try { return JSON.parse(store.get(AIPLAN) || 'null'); } catch (e) { return null; } }
function rememberPlan(p){ if (p) store.set(AIPLAN, JSON.stringify(p)); }
async function aiPost(path, body){
  const r = await fetch(AI_URL + path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({device: deviceId(), license: store.get(LICKEY) || undefined}, body || {}))});
  const j = await r.json().catch(() => ({}));
  if (j && j.plan && (r.ok || r.status === 402)) rememberPlan(j.plan);
  return {status: r.status, ok: r.ok, data: j};
}
function planHint(){
  if (!AI_URL) return '';
  const p = cachedPlan();
  if (!p) return '1 free ChatGPT question · then Plus';
  if (p.plus) return 'Plus · ' + p.left + ' ChatGPT questions left this month';
  return p.left > 0 ? p.left + ' free ChatGPT question' + (p.left === 1 ? '' : 's') + ' left' : 'Free question used · upgrade to Plus to keep asking';
}
function refreshHints(){ const h = $('#freeHint'); if (h) h.textContent = planHint(); }
function planHTML(){
  if (!AI_URL) return '<div class="plan"><span class="tag">Off</span><span>ChatGPT isn’t switched on in this build yet.</span></div>';
  const p = cachedPlan(), lic = store.get(LICKEY);
  let h = '<div class="plan">'
    + (p && p.plus ? '<span class="tag plus">Plus</span><span><b>' + p.left + '</b> of ' + p.limit + ' questions left this month</span>'
                   : '<span class="tag">Free</span><span>' + (p ? '<b>' + p.left + '</b> free question' + (p.left === 1 ? '' : 's') + ' left' : '1 free question') + '</span>')
    + '</div>';
  if (!(p && p.plus)) h += upgradeHTML(false);
  else h += '<div class="krow" style="margin-top:8px"><button class="chip" data-lic-remove>Remove licence from this device</button></div>'
    + (lic ? '<p class="klink">Licence ends …' + esc(lic.slice(-4)) + '. It works on up to 3 devices.</p>' : '');
  return h;
}
function upgradeHTML(card){
  const price = CFG.plusPrice ? ' · ' + esc(CFG.plusPrice) : '';
  return '<div class="upgrade"' + (card ? '' : ' style="margin:10px 0 0"') + '>'
    + '<p class="eyebrow">Pocket Malé Plus' + price + '</p>'
    + (card ? '<h3>You’ve used your free question</h3><p>Upgrade to keep asking ChatGPT inside every situation.</p>' : '<h3>Keep asking ChatGPT</h3>')
    + '<ul><li>Up to 300 ChatGPT questions a month, in any situation</li><li>Answers in Thaana with romanisation and meaning</li><li>Use it on up to 3 devices</li></ul>'
    + '<div class="krow">' + (CFG.upgradeUrl ? '<button class="chip" data-upgrade>Upgrade to Plus</button>' : '')
    + '<button class="chip ghost" data-lic-show>I have a licence key</button></div>'
    + '<div data-lic-box hidden><input class="kin" data-lic-input type="text" autocomplete="off" spellcheck="false" placeholder="Paste the licence key from your receipt">'
    + '<div class="krow"><button class="chip" data-lic-activate>Activate</button></div><p class="klink" data-lic-status></p></div>'
    + (CFG.upgradeUrl ? '' : '<p class="klink" style="color:#cdd3de">Purchases aren’t open yet.</p>')
    + '</div>';
}
function openUpgrade(){
  if (!CFG.upgradeUrl) return;
  const inApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
  if (inApp) inApp.open({url: CFG.upgradeUrl});
  else { const w = window.open(CFG.upgradeUrl, '_blank', 'noopener'); if (!w) location.href = CFG.upgradeUrl; }
  toast('After paying, your licence key arrives by email — paste it under “I have a licence key”.', 6000);
}
async function activateLicense(box){
  const input = box.querySelector('[data-lic-input]'), st = box.querySelector('[data-lic-status]');
  const key = (input.value || '').trim();
  if (!key){ st.textContent = 'Paste your licence key first.'; return; }
  st.textContent = 'Checking…';
  try {
    const r = await aiPost('/activate', {license: key});
    if (r.ok && r.data.plan && r.data.plan.plus){
      store.set(LICKEY, key); rememberPlan(r.data.plan);
      toast('Plus is on ✓ Ask away.'); renderAbout(); refreshHints();
      const out = $('#aiOut'); if (out && out.querySelector('.upgrade')) out.innerHTML = '';
      return;
    }
    st.textContent = r.data.reason === 'too-many-devices' ? 'This licence is already active on 3 devices.' : 'That licence key wasn’t accepted. Check it against your receipt.';
  } catch (e) { st.textContent = 'Couldn’t reach the server — check your connection.'; }
}
function syncPlan(){ if (AI_URL) aiPost('/status').then(() => { refreshHints(); if (route === 'about') renderAbout(); }).catch(() => {}); }

function filterTurns(q){
  q = q.trim().toLowerCase();
  const turns = document.querySelectorAll('#v-situation > .turns > .turn');
  const note = $('#askNote'), sid = ($('#sq') || {dataset:{}}).dataset.sitId;
  let n = 0;
  turns.forEach(el => { const hit = !q || el.textContent.toLowerCase().indexOf(q) !== -1; el.hidden = !hit; if (hit) n++; });
  if (!note) return;
  if (!q){ note.hidden = true; return; }
  note.hidden = false;
  note.innerHTML = (n ? n + ' of ' + turns.length + ' lines match. Not what you need? '
                      : 'No lines here match “' + esc(q) + '”. ')
    + '<button data-ask="' + esc(sid) + '">Ask ChatGPT →</button>';
}

let lastAI = [];
async function askAI(id, q){
  const out = $('#aiOut'); if (!out) return;
  if (!AI_URL){
    out.innerHTML = '<div class="ai-card"><p class="eyebrow">ChatGPT</p><p class="ai-p">ChatGPT isn’t switched on in this build yet.</p></div>';
    return;
  }
  const p0 = cachedPlan();
  if (p0 && !p0.plus && p0.left <= 0){ out.innerHTML = upgradeHTML(true); syncPlan(); return; }
  const x = sitById(id);
  out.innerHTML = '<div class="ai-card"><p class="eyebrow">ChatGPT · thinking…</p><p class="ai-p">“' + esc(q) + '”</p></div>';
  let r;
  try {
    r = await aiPost('/ask', {question: q, situation: {en: x.en, rom: x.rom, note: x.note, turns: x.turns.map(t => ({rom: t.rom, en: t.en}))}});
  } catch (e) {
    out.innerHTML = '<div class="ai-card err"><p class="eyebrow">ChatGPT</p><p class="ai-p">Couldn’t reach ChatGPT — check your connection and try again.</p></div>';
    return;
  }
  refreshHints();
  if (r.status === 402){ out.innerHTML = upgradeHTML(true); return; }
  if (!r.ok){
    out.innerHTML = '<div class="ai-card err"><p class="eyebrow">ChatGPT</p><p class="ai-p">' + esc(r.data.message || 'Something went wrong. Try again.') + '</p></div>';
    return;
  }
  const data = r.data, p = data.plan || {};
  lastAI = (data.phrases || []).map(ph => ({dv:String(ph.dhivehi), rom:String(ph.romanisation || ''), en:String(ph.english || ''), sit:id}));
  out.innerHTML = '<div class="ai-card">'
    + '<div class="ai-top"><p class="eyebrow">ChatGPT · “' + esc(q) + '”</p><span class="ai-badge">AI · unverified</span></div>'
    + (lastAI.length ? '<div class="turns">' + lastAI.map((ph, k) =>
        '<div class="turn you ai"><span class="who">You could say</span>'
        + '<span class="dv">' + esc(ph.dv) + '</span><span class="rom">' + esc(ph.rom) + '</span><span class="en">' + esc(ph.en) + '</span>'
        + '<span class="acts"><button class="chip" data-ai-keep="' + k + '">♡ Save</button></span></div>').join('') + '</div>' : '')
    + (data.tip ? '<p class="ai-tip">' + esc(String(data.tip)) + '</p>' : '')
    + '<p class="ai-foot">Generated by ChatGPT (' + esc(data.model || '') + '). It can get Dhivehi wrong — check with a speaker before relying on it. AI answers aren’t voiced.</p>'
    + (!p.plus && p.left <= 0 ? '<p class="ai-foot">That was your free question. <button class="chip" data-upgrade-card>Upgrade for more</button></p>' : '')
    + '</div>';
}

/* ---------- speech: pre-generated Dhivehi recordings (data.js) ---------- */
function speak(text){
  DhivehiAudio.play(text).then(ok => {
    if (ok) return;
    if (DhivehiAudio.isMuted()) toast('Sound is off — turn it back on in Settings.');
    else if (!DhivehiAudio.has(text)) toast('No recording for this line yet.');
    else toast('Couldn’t play the recording — check your volume and try again.');
  });
}

/* ---------- routing ---------- */
let route = 'home';
const TITLES = {saved:'Saved', about:'About'};

function show(r, opts){
  route = r;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#v-' + r).classList.add('on');

  const home = r === 'home';
  $('#backBtn').hidden = home;
  $('#brandMark').hidden = !home;
  $('#tagline').hidden = !home;
  const crumb = $('#crumb');
  if (home){ crumb.hidden = true; }
  else {
    crumb.hidden = false;
    crumb.textContent = r === 'situation' ? (opts && opts.title) || '' : (TITLES[r] || '');
  }

  if (home)          renderHome();
  if (r === 'saved') renderSaved();
  if (r === 'about') renderAbout();
  if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;

  if (t.closest('[data-toast-close]')){ $('#toast').hidden = true; return; }
  if (t.closest('#backBtn')){ show('home'); return; }
  if (t.closest('#gearBtn')){ show('about'); return; }

  const go = t.closest('[data-go]');
  if (go){
    const r = go.dataset.go;
    show(r);
    return;
  }

  const sit = t.closest('[data-sit]');
  if (sit){
    const id = sit.dataset.sit;
    if (!isFree(id)){
      toast('“' + esc(sitById(id).en) + '” is a premium situation. Unlock all + AI practice from the section header.', 4600);
      return;
    }
    renderSituation(id);
    show('situation', {title: sitById(id).en});
    return;
  }

  const f = t.closest('[data-filter]');
  if (f){ filter = (filter === f.dataset.filter) ? null : f.dataset.filter; renderHome(); return; }

  if (t.closest('[data-sort]')){ sortAZ = !sortAZ; renderHome(); return; }
  if (t.closest('[data-clear]')){ query = ''; filter = null; renderHome(); return; }

  if (t.closest('[data-hide-review]')){
    state.reviewCard = false; saveState(); renderHome();
    toast('Review hidden. Your saved lines are kept — turn it back on any time in Settings.', 5000);
    return;
  }
  if (t.closest('[data-toggle-mute]')){
    DhivehiAudio.setMuted(!DhivehiAudio.isMuted()); renderAbout();
    toast(DhivehiAudio.isMuted() ? 'Sound off.' : 'Sound on.'); return;
  }
  if (t.closest('[data-toggle-review]')){
    state.reviewCard = !state.reviewCard; saveState(); renderAbout();
    toast(state.reviewCard ? 'Review card back on the home screen.' : 'Review card hidden.');
    return;
  }
  if (t.closest('[data-unlock]')){
    state.unlocked = !state.unlocked; saveState();
    if (route === 'about') renderAbout(); else renderHome();
    toast(state.unlocked
      ? 'Unlocked for this demo — every situation is open. No payment involved.'
      : 'Premium situations locked again.', 4200);
    return;
  }
  if (t.closest('[data-clear-saved]')){
    const n = state.saved.length + state.aiSaved.length;
    if (!n){ toast('Nothing saved yet.'); return; }
    state.saved = []; state.aiSaved = []; saveState(); renderAbout();
    toast('Cleared ' + n + ' saved line' + (n === 1 ? '' : 's') + '.');
    return;
  }

  if (t.closest('[data-upgrade]')){ openUpgrade(); return; }
  if (t.closest('[data-upgrade-card]')){ const out = $('#aiOut'); if (out) out.innerHTML = upgradeHTML(true); return; }
  const licShow = t.closest('[data-lic-show]');
  if (licShow){ const box = licShow.closest('.upgrade').querySelector('[data-lic-box]'); box.hidden = !box.hidden; if (!box.hidden) box.querySelector('input').focus(); return; }
  const licAct = t.closest('[data-lic-activate]');
  if (licAct){ activateLicense(licAct.closest('[data-lic-box]')); return; }
  if (t.closest('[data-lic-remove]')){ store.set(LICKEY, null); store.set(AIPLAN, null); renderAbout(); refreshHints(); syncPlan(); toast('Licence removed from this device.'); return; }
  if (t.closest('[data-audio-rate]')){ toast('Speaking speed: ' + DhivehiAudio.nextRate()); renderAbout(); return; }
  const ask = t.closest('[data-ask]');
  if (ask){
    const q = (($('#sq') || {}).value || '').trim();
    if (!q){ toast('Type a question first — e.g. “how do I ask for less sugar?”'); if ($('#sq')) $('#sq').focus(); return; }
    askAI(ask.dataset.ask, q); return;
  }
  const keep = t.closest('[data-ai-keep]');
  if (keep){
    const p = lastAI[+keep.dataset.aiKeep]; if (!p) return;
    if (!state.aiSaved.some(x => x.dv === p.dv)){ state.aiSaved.push(p); saveState(); }
    keep.textContent = '♥ Saved'; keep.setAttribute('aria-pressed', 'true');
    toast('Saved to your review list, marked as AI.'); return;
  }
  const unsave = t.closest('[data-ai-unsave]');
  if (unsave){ state.aiSaved.splice(+unsave.dataset.aiUnsave, 1); saveState(); renderSaved(); toast('Removed.'); return; }

  const say = t.closest('[data-say]');
  if (say){ speak(say.dataset.say); return; }

  const fav = t.closest('[data-fav]');
  if (fav){
    const k = fav.dataset.fav, i = state.saved.indexOf(k);
    if (i === -1){ state.saved.push(k); toast('Saved to your review list.'); }
    else { state.saved.splice(i, 1); toast('Removed.'); }
    saveState();
    if (route === 'saved') renderSaved();
    else {
      fav.setAttribute('aria-pressed', String(isSaved(k)));
      const svg = fav.querySelector('svg');
      fav.textContent = isSaved(k) ? 'Saved' : 'Save';
      if (svg) fav.prepend(svg);
    }
    return;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'sq'){ filterTurns(e.target.value); return; }
  if (e.target.id !== 'q') return;
  query = e.target.value;
  const at = e.target.selectionStart;
  renderHome();
  const box = $('#q');
  if (box){ box.focus(); try { box.setSelectionRange(at, at); } catch(err){} }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-lic-input]')){ e.preventDefault(); activateLicense(e.target.closest('[data-lic-box]')); return; }
  if (e.key === 'Enter' && e.target.id === 'sq'){
    e.preventDefault();
    const q = e.target.value.trim();
    if (q) askAI(e.target.dataset.sitId, q);
    return;
  }
  if (e.key === 'Escape' && route !== 'home'){ show('home'); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const pin = e.target.closest && e.target.closest('[data-pin]');
  if (!pin) return;
  e.preventDefault();
  pin.dispatchEvent(new MouseEvent('click', {bubbles:true}));
});

/* ---------- boot ---------- */
renderHome();
renderSaved();
renderAbout();
syncPlan();

/* ---------- install as an app ---------- */
const INSTALL_HIDE = 'pocketmale.installHidden';
let installEvt = null;
const standalone = () => window.Capacitor || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function installCard(){
  if (standalone() || store.get(INSTALL_HIDE) === '1') return '';
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (ua.includes('Mac') && 'ontouchend' in document), android = /Android/.test(ua);
  let how = '';
  if (installEvt) how = '<button class="chip" data-install>Install</button>';
  else if (ios) how = '';
  else if (!android) return '';
  const sub = ios ? 'Tap <b style="display:inline">Share</b> then <b style="display:inline">Add to Home Screen</b>.'
    : installEvt ? 'Opens full-screen, works offline.'
    : 'Chrome menu ⋮ → <b style="display:inline">Install app</b>' + (CFG.androidApk ? ', or <a href="' + esc(CFG.androidApk) + '" style="color:var(--red)">download the Android app</a>' : '') + '.';
  return '<div class="install" id="installCard"><img class="ic" src="./icons/icon-192.png" alt=""><span class="tx"><b>Get Pocket Malé on your phone</b><span>' + sub + '</span></span>' + how
    + '<button class="x" data-install-hide aria-label="Dismiss">✕</button></div>';
}
function placeInstallCard(){
  const old = $('#installCard'); if (old) old.remove();
  const html = installCard(); if (!html || route !== 'home') return;
  const home = $('#v-home'); if (home) home.insertAdjacentHTML('afterbegin', html);
}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; placeInstallCard(); });
addEventListener('appinstalled', () => { installEvt = null; placeInstallCard(); toast('Installed ✓ Find Pocket Malé on your home screen.'); });
document.addEventListener('click', e => {
  if (e.target.closest('[data-install]') && installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; placeInstallCard(); }); }
  if (e.target.closest('[data-install-hide]')){ store.set(INSTALL_HIDE, '1'); placeInstallCard(); }
});
const _renderHome = renderHome;
renderHome = function(){ _renderHome(); placeInstallCard(); };
placeInstallCard();
(function openFromHash(){
  // city.html links straight to a situation: index.html#sit=teashop
  const m = location.hash.match(/sit=([\w-]+)/);
  if (m && sitById(m[1])){ renderSituation(m[1]); show('situation', {title: sitById(m[1]).en}); }
})();
</script>
