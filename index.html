<link rel="apple-touch-icon" href="./icon.svg">

<style>
:root{
  --paper:#f6f1e7;
  --paper-2:#ece3d1;
  --card:#fdfaf3;
  --ink:#1c1a16;
  --ink-2:#4e4740;
  --muted:#8a8073;
  --rule:#ded3bd;
  --lacquer:#b2361f;
  --lacquer-deep:#8c2916;
  --ochre:#c08417;
  --lagoon:#0d6663;
  --night:#10201f;
  --night-ink:#ede6d6;
  --night-muted:#95a39a;
  --night-rule:#2b423a;
  --scene-bg:#efe6d4;
  --scene-2:#d9cdb4;
  --sea:#e3ebe8;
  --shadow:0 1px 2px rgba(28,26,22,.05), 0 10px 30px -18px rgba(28,26,22,.28);
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --dv:'Noto Sans Thaana','MV Faseyha','A_Faruma','Faruma',sans-serif;
  --tabbar:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141210; --paper-2:#1d1a15; --card:#1b1813;
    --ink:#f1eade; --ink-2:#c3bbab; --muted:#8d8578; --rule:#2f2a22;
    --lacquer:#df7a5f; --lacquer-deep:#e89476; --ochre:#e0a83c; --lagoon:#63bdb1;
    --night:#0c1817; --night-ink:#ede6d6; --night-muted:#93a199; --night-rule:#26392f;
    --scene-bg:#241f19; --scene-2:#342d23;
  --sea:#111b1a;
    --sea:#111b1a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#141210; --paper-2:#1d1a15; --card:#1b1813;
  --ink:#f1eade; --ink-2:#c3bbab; --muted:#8d8578; --rule:#2f2a22;
  --lacquer:#df7a5f; --lacquer-deep:#e89476; --ochre:#e0a83c; --lagoon:#63bdb1;
  --night:#0c1817; --night-ink:#ede6d6; --night-muted:#93a199; --night-rule:#26392f;
  --scene-bg:#241f19; --scene-2:#342d23;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--lacquer);outline-offset:2px;border-radius:6px}

.dv{font-family:var(--dv);direction:rtl;unicode-bidi:isolate;line-height:1.9}
.rom{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.01em}
.eyebrow{font-family:var(--mono);font-size:.63rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* ---------------- shell ---------------- */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;min-height:56px;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule);
}
.topbar .mark{font-family:var(--display);font-style:italic;font-size:1.08rem;white-space:nowrap}
.topbar .mark span{font-family:var(--dv);font-style:normal;color:var(--lacquer);font-size:1.1rem;margin-left:6px}
.topbar .ctx{margin-left:auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.back{
  display:inline-flex;align-items:center;gap:7px;
  font-size:.85rem;color:var(--lacquer);padding:4px 0;margin-right:2px;
}

main{flex:1;padding:0 0 calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 18px)}
.view{display:none;padding:20px 18px 8px}
.view.on{display:block}
.view-head{margin-bottom:18px}
.view-head h2{font-size:1.6rem;line-height:1.15;margin-top:6px}
.view-head p{font-size:.9rem;color:var(--ink-2);margin-top:8px;max-width:56ch}

/* ---------------- tabbar ---------------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--paper) 95%,transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px 9px;color:var(--muted);
  font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
  border-top:2px solid transparent;margin-top:-1px;
}
.tabbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--lacquer);border-top-color:var(--lacquer)}
.tabbar .badge{
  position:absolute;transform:translate(13px,-6px);
  background:var(--lacquer);color:var(--paper);
  font-size:.55rem;line-height:1;padding:3px 5px;border-radius:999px;
}

/* ---------------- situation grid ---------------- */
.sits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sit{
  background:var(--card);border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;text-align:left;display:flex;flex-direction:column;
  transition:border-color .15s, transform .12s;
}
.sit:active{transform:scale(.985)}
.sit:hover{border-color:var(--ink-2)}
.sit .scene{display:block;width:100%;height:auto;background:var(--scene-bg)}
.sit .lab{padding:11px 12px 13px;display:flex;flex-direction:column;gap:2px}
.sit .lab .dv{font-size:1.36rem;color:var(--ink)}
.sit .lab .en{font-size:.82rem;color:var(--ink-2)}

/* ---------------- situation detail ---------------- */
.note{
  background:var(--paper-2);border-left:3px solid var(--ochre);
  padding:13px 15px;border-radius:0 8px 8px 0;margin:18px 0 22px;
}
.note .eyebrow{color:var(--ochre)}
.note p{font-size:.88rem;color:var(--ink-2);margin-top:6px}

.turns{display:flex;flex-direction:column;gap:10px}
.turn{
  background:var(--card);border:1px solid var(--rule);
  border-radius:12px;padding:13px 15px;max-width:88%;
  display:flex;flex-direction:column;gap:3px;position:relative;
}
.turn.you{align-self:flex-start;border-bottom-left-radius:3px}
.turn.them{align-self:flex-end;border-bottom-right-radius:3px;background:var(--paper-2)}
.turn .who{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.turn.them .who{color:var(--lagoon)}
.turn .dv{font-size:1.56rem;color:var(--ink)}
.turn.them .dv{color:var(--lagoon)}
.turn .en{font-family:var(--display);font-style:italic;font-size:.95rem;color:var(--ink-2);margin-top:2px}
.turn .acts{display:flex;gap:8px;margin-top:9px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;color:var(--ink-2);
  border:1px solid var(--rule);border-radius:999px;padding:4px 10px;background:var(--paper);
}
.chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chip[aria-pressed="true"]{color:var(--lacquer);border-color:var(--lacquer)}
.chip[aria-pressed="true"] svg{fill:var(--lacquer);stroke:var(--lacquer)}
.chip:hover{border-color:var(--ink-2)}

.detail-hero{border-radius:10px;overflow:hidden;border:1px solid var(--rule);margin-bottom:16px}
.detail-hero .scene{display:block;width:100%;height:auto;background:var(--scene-bg)}

.sv-link{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--rule);border-radius:10px;background:var(--card);
  padding:12px 14px;margin-top:18px;text-decoration:none;
}
.sv-link:hover{border-color:var(--ink-2)}
.sv-link .t{font-size:.86rem}
.sv-link .s{font-size:.75rem;color:var(--muted)}
.sv-link .arrow{margin-left:auto;color:var(--lacquer)}

/* ---------------- walk / street view ---------------- */
.seg{display:flex;gap:6px;background:var(--paper-2);padding:4px;border-radius:999px;margin-bottom:18px}
.seg button{
  flex:1;padding:8px 10px;border-radius:999px;font-size:.84rem;color:var(--ink-2);
}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------------- offline vector map ---------------- */
.mapwrap{
  border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  background:var(--card);margin-bottom:8px;
}
.map{display:block;width:100%;aspect-ratio:4/3;height:auto}
.map .sea{fill:var(--sea)}
.map .m-land{fill:var(--card);stroke:none}
.map .m-coast{fill:none;stroke:var(--ink);stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.map .m-main{fill:none;stroke:var(--ink-2);stroke-width:1.2px;stroke-linecap:round;opacity:.75}
.map .m-minor{fill:none;stroke:var(--muted);stroke-width:.8px;stroke-linecap:round;opacity:.8}
.map .m-island{
  fill:var(--muted);font-family:var(--mono);letter-spacing:.18em;
  text-anchor:middle;dominant-baseline:middle;
}
.map .m-pin{cursor:pointer}
.map .m-pin .halo{fill:var(--lacquer);opacity:.16}
.map .m-pin .dot{fill:var(--lacquer);stroke:var(--card);stroke-width:1px;vector-effect:non-scaling-stroke}
.map .m-pin text{fill:var(--ink);font-family:var(--sans);font-weight:500;paint-order:stroke;stroke:var(--sea);stroke-width:3px;vector-effect:non-scaling-stroke}
.map .m-pin:hover .halo,.map .m-pin:focus-visible .halo{opacity:.3}
.map .m-pin.on .halo{fill:var(--ochre);opacity:.42}
.map .m-pin.on .dot{fill:var(--ochre)}
.map .m-scale path{stroke:var(--ink-2);stroke-width:1px;fill:none}
.map .m-scale text{fill:var(--muted);font-family:var(--mono)}
.mapcap{
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.07em;color:var(--muted);
  margin:0 0 18px;padding:0 2px;line-height:1.7;
}
.mapcap a{color:var(--muted)}

.spots{display:flex;flex-direction:column;gap:14px}
.spot{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.spot.on{border-color:var(--ochre);box-shadow:0 0 0 3px color-mix(in srgb,var(--ochre) 18%,transparent)}
.spot .head{padding:13px 15px;display:flex;align-items:flex-start;gap:12px}
.spot .head h3{font-size:1.05rem}
.spot .head .rom{display:block;margin-top:3px}
.spot .head .dv{font-size:1.26rem;color:var(--lacquer);margin-left:auto;white-space:nowrap}
.spot .desc{padding:0 15px 13px;font-size:.85rem;color:var(--ink-2)}
.spot .pano{
  position:relative;background:var(--night);
  aspect-ratio:16/10;border-top:1px solid var(--rule);
}
.spot .pano iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.pano-cta{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;color:var(--night-ink);text-align:center;padding:20px;
}
.pano-cta .big{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--ochre);color:var(--night);border-radius:999px;padding:9px 18px;
  font-size:.85rem;font-weight:500;
}
.pano-cta .sub{font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;color:var(--night-muted);max-width:38ch;line-height:1.7}
.pano-cta a{color:var(--ochre)}
.spot .foot{
  padding:11px 15px;border-top:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:.63rem;letter-spacing:.06em;color:var(--muted);
}
.spot .foot a{color:var(--lacquer);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--lacquer) 40%,transparent)}

.sv-disclaimer{
  margin-top:20px;padding:13px 15px;border:1px dashed var(--rule);border-radius:10px;
  font-size:.8rem;color:var(--muted);
}

/* ---------------- saved ---------------- */
.empty{
  border:1px dashed var(--rule);border-radius:12px;padding:34px 22px;text-align:center;
}
.empty .dv{font-size:2rem;color:var(--muted);display:block;margin-bottom:10px}
.empty p{font-size:.88rem;color:var(--muted);max-width:34ch;margin:0 auto}
.saved-list{display:flex;flex-direction:column;gap:10px}
.saved-item{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 15px}
.saved-item .from{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.saved-item .dv{font-size:1.5rem}
.saved-item .en{font-family:var(--display);font-style:italic;font-size:.92rem;color:var(--ink-2);margin-top:3px}

/* ---------------- about ---------------- */
.about section{padding:20px 0;border-top:1px solid var(--rule)}
.about section:first-of-type{border-top:0;padding-top:0}
.about h3{font-size:1.15rem;margin-bottom:8px}
.about p{font-size:.9rem;color:var(--ink-2);margin-top:8px;max-width:60ch}
.fn-row{display:grid;grid-template-columns:auto auto auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.fn-row:first-of-type{border-top:1px solid var(--rule)}
.fn-row .base{font-family:var(--dv);font-size:1.6rem;color:var(--muted)}
.fn-row .op{font-family:var(--mono);font-size:.66rem;color:var(--ochre);white-space:nowrap}
.fn-row .made{font-family:var(--dv);font-size:1.6rem;color:var(--ink)}
.fn-row .say{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:right}
.fn-row .say b{color:var(--ink-2);font-weight:500}
.warn{background:var(--paper-2);border-left:3px solid var(--lacquer);padding:13px 15px;border-radius:0 8px 8px 0;margin-top:14px}
.warn p{font-size:.86rem;color:var(--ink-2);margin-top:6px}
.warn .eyebrow{color:var(--lacquer)}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px);
  background:var(--night);color:var(--night-ink);
  font-size:.8rem;padding:9px 16px;border-radius:999px;z-index:60;
  box-shadow:var(--shadow);max-width:86vw;text-align:center;
}
.toast[hidden]{display:none}

/* ---------------- scene svg ---------------- */
.scene .bg{fill:var(--scene-bg)}
.scene .e{fill:var(--scene-2)}
.scene .a{fill:var(--lacquer)}
.scene .b{fill:var(--lagoon)}
.scene .c{fill:var(--ochre)}
.scene .d{fill:var(--ink)}
.scene .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene .lnm{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round}

/* ---------------- desktop ---------------- */
@media (min-width:760px){
  :root{--tabbar:0px}
  .app{flex-direction:row;min-height:100vh}
  .tabbar{
    position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;
    display:flex;flex-direction:column;align-items:stretch;gap:2px;
    width:206px;flex:0 0 206px;
    border-top:0;border-right:1px solid var(--rule);
    padding:76px 14px 20px;
  }
  .tabbar button{
    flex-direction:row;justify-content:flex-start;gap:11px;
    padding:9px 12px;border-top:0;border-radius:8px;margin-top:0;
    font-size:.7rem;letter-spacing:.06em;
  }
  .tabbar button[aria-selected="true"]{background:var(--paper-2);border-top-color:transparent}
  .tabbar .badge{position:static;transform:none;margin-left:auto}
  .shellmain{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{padding:14px 32px}
  main{padding-bottom:40px}
  .view{padding:28px 32px;max-width:880px}
  .view-head h2{font-size:2.1rem}
  .sits{grid-template-columns:repeat(3,1fr);gap:16px}
  .turn{max-width:74%}
  .toast{bottom:26px;left:auto;right:26px;transform:none}
  .brandblock{position:absolute;top:18px;left:26px;font-family:var(--display);font-style:italic;font-size:1.1rem}
  .brandblock span{font-family:var(--dv);font-style:normal;color:var(--lacquer);font-size:.95rem;margin-left:5px}
  .topbar .mark{display:none}
  .topbar .back{margin-right:0}
}
@media (max-width:759px){.brandblock{display:none}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="app">
  <nav class="tabbar" role="tablist" aria-label="Sections">
    <div class="brandblock">Pocket Malé <span>ހަލޯ؟</span></div>
    <button role="tab" data-tab="phrases" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
      Phrases
    </button>
    <button role="tab" data-tab="walk" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="7"/><path d="M12 3v14M5 10h14"/></svg>
      Walk
    </button>
    <button role="tab" data-tab="saved" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.8C19 15.6 12 20 12 20z"/></svg>
      Saved<span class="badge" id="savedBadge" hidden>0</span>
    </button>
    <button role="tab" data-tab="about" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      About
    </button>
  </nav>

  <div class="shellmain">
    <header class="topbar">
      <button class="back" id="backBtn" hidden>← Situations</button>

      <div class="ctx" id="ctx">Malé · Dhivehi</div>
    </header>

    <main>
      <section class="view on" id="view-phrases"></section>
      <section class="view" id="view-walk"></section>
      <section class="view" id="view-saved"></section>
      <section class="view" id="view-about"></section>
    </main>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   Pocket Malé — situation phrasebook for Malé, Maldives
   Street View panorama IDs below were resolved against Google
   Maps on 2026-09-12. Malé has no dense Street View car
   coverage; these are user-contributed photospheres (2e10),
   which is why each spot pins a specific pano ID rather than
   letting a lat/lng snap to whatever is nearest.
   ============================================================ */

/* ---------- scene art ---------- */
function frame(inner){
  return '<svg class="scene" viewBox="0 0 320 190" role="img" preserveAspectRatio="xMidYMid slice">'
    + '<rect class="bg" x="0" y="0" width="320" height="190"/>' + inner + '</svg>';
}
const SCENES = {
  teashop: frame(`
    <rect class="e" x="0" y="132" width="320" height="58"/>
    <rect class="a" x="18" y="18" width="284" height="20"/>
    <rect class="c" x="18" y="18" width="40" height="20"/><rect class="c" x="98" y="18" width="40" height="20"/>
    <rect class="c" x="178" y="18" width="40" height="20"/><rect class="c" x="258" y="18" width="40" height="20"/>
    <path class="ln" d="M18 38q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0q10 12 20 0"/>
    <rect class="d" x="52" y="96" width="216" height="7" rx="2"/>
    <rect class="ln" x="66" y="103" width="188" height="30"/>
    <rect class="c" x="78" y="112" width="42" height="13" rx="2"/>

/* OSM coastline arrives as separate ways that share end nodes. Chain them
   back into rings so the islands can be filled as land rather than left as
   outlines on an undifferentiated tint. */
let LAND = '';
function stitchLand(d){
  const chains = d.split('M').filter(Boolean).map(sub =>
    sub.split('L').map(pt => pt.trim().split(/\s+/).map(Number))
  );
  const k = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  let merged = true;
  while (merged){
    merged = false;
    outer:
    for (let i = 0; i < chains.length; i++){
      const a = chains[i];
      if (!a) continue;
      if (k(a[0]) === k(a[a.length - 1])) continue;       // already a ring
      for (let j = 0; j < chains.length; j++){
        const b = chains[j];
        if (i === j || !b) continue;
        if      (k(a[a.length-1]) === k(b[0]))            chains[i] = a.concat(b.slice(1));
        else if (k(a[a.length-1]) === k(b[b.length-1]))    chains[i] = a.concat(b.slice(0,-1).reverse());
        else if (k(a[0])          === k(b[b.length-1]))    chains[i] = b.concat(a.slice(1));
        else if (k(a[0])          === k(b[0]))             chains[i] = b.slice().reverse().concat(a.slice(1));
        else continue;
        chains[j] = null; merged = true;
        break outer;
      }
    }
  }
  return chains.filter(c => c && c.length > 8)
    .map(c => 'M' + c.map(p => p[0] + ' ' + p[1]).join('L') + 'Z')
    .join('');
}

function niceDistance(m){
  const steps = [100,200,250,500,1000,2000,5000];
  for (const s of steps) if (m <= s) return s;
  return 5000;
}

function mapSvg(view, activeKey){
  const v = MAP.views[view] || MAP.views.both;
  const [vx, vy, vw, vh] = v.vb.split(' ').map(Number);
  const r  = vw * 0.0135;
  const fs = vw * 0.026;
  const overview = view === 'both';

  // scale bar: about a quarter of the visible width, rounded to a sensible number
  const barM = niceDistance(vw * MAP.mPerUnit / 4);
  const barU = barM / MAP.mPerUnit;
  const bx = vx + vw * 0.62, by = vy + vh * 0.93;

  const keys = Object.keys(MAP.pins).filter(k => overview || SPOTS[k].island === view);

  return '<svg class="map" viewBox="' + v.vb + '" preserveAspectRatio="xMidYMid meet" '
    + 'style="aspect-ratio:' + (v.ar || '4/3') + '" '
    + 'role="img" aria-label="Map of ' + esc(v.label) + ' showing the panorama locations">'
    + '<rect class="sea" x="' + vx + '" y="' + vy + '" width="' + vw + '" height="' + vh + '"/>'
    + '<path class="m-land" d="' + LAND + '"/>'
    + '<path class="m-minor" d="' + MAP.minor + '" vector-effect="non-scaling-stroke"/>'
    + '<path class="m-main" d="' + MAP.main + '" vector-effect="non-scaling-stroke"/>'
    + '<path class="m-coast" d="' + MAP.coast + '" vector-effect="non-scaling-stroke"/>'
    + (overview ? MAP.islands.map(i =>
        '<text class="m-island" x="' + i.x + '" y="' + i.y + '" font-size="' + (vw * 0.019) + '">'
        + esc(i.n) + '</text>').join('') : '')
    + keys.map(k => {
        const [x, y] = MAP.pins[k];
        const on = k === activeKey;
        return '<g class="m-pin' + (on ? ' on' : '') + '" data-pin="' + k + '" tabindex="0" role="button" '
          + 'aria-label="' + esc(SPOTS[k].name) + '">'
          + '<circle class="halo" cx="' + x + '" cy="' + y + '" r="' + (r * 2.2) + '"/>'
          + '<circle class="dot" cx="' + x + '" cy="' + y + '" r="' + r + '"/>'
          + (overview ? '' : (() => {
              const flip = x > vx + vw * 0.55;
              return '<text x="' + (flip ? x - r * 1.9 : x + r * 1.9) + '" y="' + (y + fs * 0.34)
                + '" font-size="' + fs + '" text-anchor="' + (flip ? 'end' : 'start') + '">'
                + esc(SPOTS[k].short) + '</text>';
            })())
          + '</g>';
      }).join('')
    + '<g class="m-scale">'
    + '<path d="M' + bx + ' ' + by + 'h' + barU + '" vector-effect="non-scaling-stroke"/>'
    + '<path d="M' + bx + ' ' + (by - vh * 0.014) + 'v' + (vh * 0.028)
    + 'M' + (bx + barU) + ' ' + (by - vh * 0.014) + 'v' + (vh * 0.028) + '" vector-effect="non-scaling-stroke"/>'
    + '<text x="' + bx + '" y="' + (by - vh * 0.028) + '" font-size="' + (vw * 0.018) + '">'
    + (barM >= 1000 ? (barM / 1000) + ' km' : barM + ' m') + '</text>'
    + '</g></svg>';
}

function panoEmbed(s){
  return 'https://www.google.com/maps/embed?pb=!4v1!6m8!1m7!1s' + s.pano
       + '!2m2!1d' + s.lat + '!2d' + s.lng
       + '!3f' + s.heading + '!4f0!5f0.7820865974627469';
}
function panoLink(s){
  return 'https://www.google.com/maps/@?api=1&map_action=pano&pano=' + s.pano
       + '&heading=' + s.heading + '&pitch=0&fov=90';
}

LAND = stitchLand(MAP.coast);

const KEY = 'pocketmale.saved.v1';
function loadSaved(){
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch(e){ return []; }
}
function persist(list){
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){}
}
let saved = loadSaved();
const keyOf = (sitId, i) => sitId + ':' + i;
const isSaved = k => saved.indexOf(k) !== -1;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg){
  const t = $('#toast');

  if (!saved.length){
    body = '<div class="empty"><span class="dv">ހުސް</span>'
      + '<p>Nothing saved yet. Tap ♡ on any line and it will wait for you here.</p></div>';
  } else {
    body = '<div class="saved-list">' + saved.map(k => {
      const [sid, idx] = k.split(':');
      const s = SITUATIONS.find(x => x.id === sid);
      if (!s) return '';
      const t = s.turns[+idx];
      if (!t) return '';
      return '<div class="saved-item">'
        + '<div class="from">' + esc(s.en) + ' · ' + (t.s === 'you' ? 'you say' : 'they say') + '</div>'
        + '<div class="dv">' + t.dv + '</div>'
        + '<div class="rom">' + esc(t.rom) + '</div>'
        + '<div class="en">' + esc(t.en) + '</div>'
        + '<span class="acts" style="display:flex;gap:8px;margin-top:10px">'
        + '<button class="chip" data-say="' + esc(t.dv) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Listen</button>'
        + '<button class="chip" data-fav="' + k + '" aria-pressed="true">Remove</button>'
        + '</span></div>';
    }).join('') + '</div>';
  }
  el.innerHTML = '<div class="view-head"><p class="eyebrow">Your review list</p>'
    + '<h2>Saved lines.</h2>'
    + '<p>Kept on this device only — no account, nothing uploaded.</p></div>' + body;
}

function renderAbout(){
  $('#view-about').innerHTML =
    '<div class="view-head"><p class="eyebrow">About</p><h2>Pocket Malé</h2>'
    + '<p>A situation-based Dhivehi phrasebook for the city, with street-level panoramas of the places the phrases belong to.</p></div>'
    + '<div class="about">'
    + '<section><h3>Reading the fili</h3>'
    + '<p>Thaana is twenty-four letters and ten <em>fili</em> — the vowel marks that ride above and below them. A letter on its own is only a consonant; the fili tells you what to say.</p>'
    + '<div class="fn-row"><span class="base">ސ</span><span class="op">+ abafili =</span><span class="made">ސަ</span><span class="say"><b>sa</b> · <span class="dv">ސައި</span>, tea</span></div>'
    + '<div class="fn-row"><span class="base">ބ</span><span class="op">+ eybeyfili =</span><span class="made">ބޭ</span><span class="say"><b>bey</b> · <span class="dv">ބޭސް</span>, medicine</span></div>'
    + '<div class="fn-row"><span class="base">ކ</span><span class="op">+ ubufili =</span><span class="made">ކު</span><span class="say"><b>ku</b> · <span class="dv">ކުލި</span>, rent</span></div>'
    + '</section>'
    + '<section><h3>Malé Dhivehi, not the written register</h3>'
    + '<p>The spoken city dialect. Where a textbook teaches <span class="dv">އަޅުގަނޑު</span> (<span class="rom">alhugandu</span>), across a counter in Malé you will hear <span class="dv">އަހަރެން</span> (<span class="rom">ahuren</span>). The atoll dialects — Addu, Fuvahmulah, Huvadhu — differ enough that mixing them in would confuse more than help, so they are left out.</p></section>'
    + '<section><h3>Audio</h3>'
    + '<p>Listen uses your device speech synthesis. Almost no device ships a Dhivehi voice, so it will usually tell you so rather than read the line out in the wrong language — recorded audio is what a real build would ship.</p></section>'
    + '<section><h3>Street View</h3>'
    + '<p>The six panoramas are user-contributed 360° photospheres resolved against Google Maps, pinned by panorama ID. Imagery © Google and its contributors. If a panel stays blank, the page is being served somewhere that blocks Google frames — use the "Open in Google Maps" link underneath it.</p></section>'
    + '<section><div class="warn"><p class="eyebrow">Check the Dhivehi before shipping</p>'
    + '<p>This is a demonstration build. The Thaana has not been reviewed by a native speaker — spelling, fili placement and the naturalness of the longer sentences all need checking before it goes in front of anyone learning from it.</p></div></section>'
    + '</div>';
}

/* ---------- speech ---------- */
function speak(text){
  if (!('speechSynthesis' in window)){
    toast('This device has no speech synthesis.'); return;
  }
  const voices = speechSynthesis.getVoices() || [];
  const dv = voices.find(v => /^dv(-|_|$)/i.test(v.lang || ''));
  if (!dv){
    toast('No Dhivehi voice on this device — a real build ships recorded audio.');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.voice = dv; u.lang = dv.lang; u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- navigation ---------- */
let current = 'phrases';
function showTab(tab){
  current = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#view-' + tab).classList.add('on');
  document.querySelectorAll('.tabbar button[data-tab]').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  });
  $('#backBtn').hidden = true;
  $('#ctx').textContent = tab === 'walk' ? 'Street View' : 'Malé · Dhivehi';
  if (tab === 'phrases') renderPhrases();
  if (tab === 'saved') renderSaved();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tabbar button[data-tab]');
  if (tabBtn){ showTab(tabBtn.dataset.tab); return; }

  const sit = e.target.closest('[data-sit]');
  if (sit){
    renderSituation(sit.dataset.sit);
    $('#backBtn').hidden = false;
    return;
  }

  if (e.target.closest('#backBtn')){ showTab('phrases'); return; }

  const island = e.target.closest('[data-island]');
  if (island){ renderWalk(island.dataset.island, null); return; }

  const pin = e.target.closest('[data-pin]');
  if (pin){
    const key = pin.dataset.pin;
    renderWalk(SPOTS[key].island === walkView || walkView === 'both' ? walkView : SPOTS[key].island, key);
    const el = document.getElementById('spot-' + key);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const goto = e.target.closest('[data-goto-spot]');
  if (goto){
    const key = goto.dataset.gotoSpot;
    renderWalk(SPOTS[key].island, key);
    showTabOnly('walk');
    const el = document.getElementById('spot-' + key);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }

  const load = e.target.closest('[data-load]');
  if (load){
    const key = load.dataset.load;
    const box = document.querySelector('.pano[data-pano="' + key + '"]');
    const s = SPOTS[key];
    box.innerHTML = '<iframe title="Street View — ' + esc(s.name) + '" src="' + panoEmbed(s)
      + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>';
    // A working Google embed builds nested subframes; one blocked by a strict
    // frame-src policy stays at about:blank with none. Fall back to the link.
    setTimeout(() => {
      const f = box.querySelector('iframe');
      if (!f) return;
      let nested = 1;
      try { nested = f.contentWindow ? f.contentWindow.length : 0; } catch (err) { nested = 1; }
      if (nested === 0){
        box.innerHTML = '<div class="pano-cta">'
          + '<span class="sub">This page is served somewhere that blocks Google frames. The panorama opens fine in a new tab.</span>'
          + '<a class="big" href="' + panoLink(s) + '" target="_blank" rel="noopener noreferrer">Open in Google Maps ↗</a></div>';
      }
    }, 4000);
    return;
  }

  const say = e.target.closest('[data-say]');
  if (say){ speak(say.dataset.say); return; }

  const fav = e.target.closest('[data-fav]');
  if (fav){
    const k = fav.dataset.fav;
    const i = saved.indexOf(k);
    if (i === -1){ saved.push(k); toast('Saved to your review list.'); }
    else { saved.splice(i, 1); toast('Removed.'); }
    persist(saved);
    updateBadge();
    if (current === 'saved') renderSaved();
    else {
      fav.setAttribute('aria-pressed', String(isSaved(k)));
      const svg = fav.querySelector('svg');
      fav.textContent = isSaved(k) ? 'Saved' : 'Save';
      if (svg) fav.prepend(svg);
    }
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const pin = e.target.closest && e.target.closest('[data-pin]');
  if (!pin) return;
  e.preventDefault();
  pin.dispatchEvent(new MouseEvent('click', {bubbles:true}));
});

function showTabOnly(tab){
  current = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#view-' + tab).classList.add('on');
  document.querySelectorAll('.tabbar button[data-tab]').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  });
  $('#backBtn').hidden = true;
  $('#ctx').textContent = tab === 'walk' ? 'Street View' : 'Malé · Dhivehi';
}

/* ---------- boot ---------- */
renderPhrases();
renderWalk('male');
renderSaved();
renderAbout();
updateBadge();
</script>
